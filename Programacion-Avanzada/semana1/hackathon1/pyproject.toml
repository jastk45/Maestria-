[project]
name = "ai-model-monitor"
version = "0.1.0"
description = "Starter project for Hackathon 1"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "pyarrow>=18,<26",
]

[project.scripts]
ai-model-monitor = "ai_model_monitor.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_model_monitor"]
